<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập | Math EdTech Việt Nam</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#0057c2",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-white  font-display min-h-screen flex items-center justify-center p-0 m-0 text-[1rem]">
<div class="flex w-full min-h-screen">
<!-- Left Side: Branding & Illustration -->
<div class="hidden lg:flex lg:w-1/2 bg-primary relative flex-col items-center justify-center overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-white/10 rounded-full blur-[8rem]"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[60rem] h-[60rem] bg-white/5 rounded-full blur-[10rem]"></div>
<div class="relative z-10 text-center px-[3rem]">
<div class="mb-[2rem]">
<img alt="Math Education Illustration" class="w-[25rem] h-auto mx-auto rounded-xl shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGIQTcprY83xAjv0z4XyZWm9LJsRcfLVtoF31sieWB0_ENDZiYijROoNPnpz5vGkSwGaxxSASyktNOQ9uWHx6AuAatltAM5ElgGJ7-0LktQACInwqZXqIsL6UA0kmhl6dVMBbG3-j13Bm1DpE1DhLV32lX7bJ_SC3bmQ6l48iR3K1otYEDIGIJ9Uz2dCd2_-esIfj4RdzQ1Yq77y0XojJl-V_eGQPk05tHFZrT5wdn2QkFqcfIFxH358OxYKw4KdzOFB9530JdQCLh"/>
</div>
<h1 class="text-[2.5rem] font-bold text-white mb-[1rem] leading-tight">Chào mừng bạn trở lại!</h1>
<p class="text-white/80 text-[1.125rem] max-w-[32rem] mx-auto">Cùng chinh phục môn Toán mỗi ngày với các phương pháp học hiện đại và thú vị.</p>
</div>
<!-- Small floating math symbols for aesthetics -->
<div class="absolute top-[5rem] left-[5rem] text-white/20 text-[4rem] font-bold">∑</div>
<div class="absolute bottom-[5rem] right-[10rem] text-white/20 text-[4rem] font-bold">π</div>
<div class="absolute top-1/2 right-[2.5rem] text-white/20 text-[3.5rem] font-bold">√</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-[2rem] lg:p-[4rem] bg-white ">
<div class="w-full max-w-[520px]">
<!-- Logo - Perfectly Centered -->
<div class="flex flex-col items-center gap-[1rem] mb-[2.5rem]">
<div class="w-[3rem] h-[3rem] bg-primary rounded-lg flex items-center justify-center">
<span class="material-icons text-white text-[1.75rem]">functions</span>
</div>
<span class="text-[1.5rem] font-bold text-slate-800  tracking-tight">MathGenius</span>
</div>
<!-- Title - Perfectly Centered -->
<div class="mb-[2.5rem] text-center">
<h2 class="text-[2rem] font-bold text-slate-800  mb-[0.5rem]">Đăng nhập</h2>
<p class="text-slate-500  text-[1rem]">Vui lòng nhập thông tin để truy cập bài học của bạn.</p>
</div>
<!-- Form -->
<form class="space-y-[1.5rem]" onsubmit="return false;">
<div>
<label class="block text-[0.875rem] font-semibold text-slate-700  mb-[0.5rem]" for="fullname">Họ và Tên</label>
<input class="w-full px-[1rem] py-[0.875rem] rounded-lg border border-slate-200  bg-white  text-slate-900  focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 outline-none" id="fullname" placeholder="Nhập họ và tên của bạn" type="text"/>
</div>
<div>
<label class="block text-[0.875rem] font-semibold text-slate-700  mb-[0.5rem]" for="identity">Số điện thoại hoặc Email</label>
<input class="w-full px-[1rem] py-[0.875rem] rounded-lg border border-slate-200  bg-white  text-slate-900  focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 outline-none" id="identity" placeholder="Nhập email hoặc số điện thoại" type="text"/>
</div>
<div>
<div class="flex justify-between items-center mb-[0.5rem]">
<label class="block text-[0.875rem] font-semibold text-slate-700 " for="password">Mật khẩu</label>
<a class="text-[0.875rem] font-medium text-primary hover:underline transition-all duration-200" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<input class="w-full px-[1rem] py-[0.875rem] rounded-lg border border-slate-200  bg-white  text-slate-900  focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300 outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-[0.75rem] top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors" type="button">
<span class="material-icons text-[1.25rem]">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-[1rem] rounded-lg transition-all duration-300 shadow-lg shadow-primary/20 flex items-center justify-center gap-[0.5rem] text-[1.125rem]" type="submit">
                    Đăng nhập
                </button>
</form>
<!-- Divider -->
<div class="relative my-[2rem]">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 "></div>
</div>
<div class="relative flex justify-center text-[0.875rem]">
<span class="px-[1rem] bg-white  text-slate-500">Hoặc tiếp tục với</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid gap-[1rem]">
<button class="flex items-center justify-center gap-[0.75rem] px-[1rem] py-[0.875rem] border border-slate-200  rounded-lg bg-white  hover:bg-slate-50  transition-all duration-300 group">
<svg class="w-[1.25rem] h-[1.25rem] group-hover:scale-110 transition-transform duration-300" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-[0.875rem] font-semibold text-slate-700 ">Google</span>
</button>
</div>
<!-- Footer -->
<p class="text-center mt-[2.5rem] text-slate-500  text-[0.875rem]">
                Bạn chưa có tài khoản? 
                <a class="text-primary font-bold hover:underline ml-[0.25rem] transition-all duration-200" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
</div>
</body></html>
