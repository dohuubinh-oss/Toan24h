<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow4-title flow4-desc" id="flow-4-appeals-lifecycle-root">
        <title id="flow4-title">Vòng đời Chấm thi và Phúc khảo toan6789.vn</title>
        <desc id="flow4-desc">Biểu đồ máy trạng thái hữu hạn (State Machine) mô tả các trạng thái SUBMITTED, NEEDS_REVIEW, PUBLISHED, APPEAL_FILED, UNDER_EVALUATION và FINALIZED.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #flow-4-appeals-lifecycle-root { --color-paper: #ffffff;
      --color-paper-2: #f8fafc;
      --color-ink: #0f172a;
      --color-muted: #475569;
      --color-soft: #64748b;
      --color-rule: rgba(15, 23, 42, 0.12);
      --color-rule-solid: #cbd5e1;
      --color-accent: #2563eb;
      --color-accent-tint: rgba(37, 99, 235, 0.08);
      --color-link: #1d4ed8;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger: #ef4444;
      --font-sans: 'Lexend', system-ui, sans-serif;
      --font-serif: 'Lexend', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace; }
      @media (prefers-color-scheme: dark) {
#flow-4-appeals-lifecycle-root { --color-paper: #0f172a;
        --color-paper-2: #1e293b;
        --color-ink: #f8fafc;
        --color-muted: #94a3b8;
        --color-soft: #64748b;
        --color-rule: rgba(248, 250, 252, 0.12);
        --color-rule-solid: #334155;
        --color-accent: #60a5fa;
        --color-accent-tint: rgba(96, 165, 250, 0.12);
        --color-link: #93c5fd;
        --color-success: #4ade80;
        --color-warning: #fbbf24;
        --color-danger: #f87171; }
}
      #flow-4-appeals-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-4-appeals-lifecycle-root .container { max-width: 1200px; margin: 0 auto; }
      #flow-4-appeals-lifecycle-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem; }
      #flow-4-appeals-lifecycle-root .subtitle { font-size: 0.975rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 72ch; }
      #flow-4-appeals-lifecycle-root .diagram-container { background: var(--color-paper-2);
      border-radius: 10px;
      border: 1px solid var(--color-rule);
      padding: 1.5rem;
      overflow-x: auto;
      max-width: 100%; }
      #flow-4-appeals-lifecycle-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--color-rule); }
      #flow-4-appeals-lifecycle-root .card-dot { width: 8px; height: 8px; border-radius: 50%; }
      #flow-4-appeals-lifecycle-root .card-dot.accent { background: var(--color-accent); }
      #flow-4-appeals-lifecycle-root .card-dot.warning { background: var(--color-warning); }
      #flow-4-appeals-lifecycle-root .card-dot.success { background: var(--color-success); }</style>
          <pattern id="flow-4-appeals-lifecycle-grid-dots-4" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.8" fill="#0f172a" fill-opacity="0.08"/>
          </pattern>
          <marker id="flow-4-appeals-lifecycle-arr-muted-4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
          </marker>
          <marker id="flow-4-appeals-lifecycle-arr-accent-4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
          </marker>
          <marker id="flow-4-appeals-lifecycle-arr-success-4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
          </marker>
          <marker id="flow-4-appeals-lifecycle-arr-warning-4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
          </marker>
          <marker id="flow-4-appeals-lifecycle-arr-danger-4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#flow-4-appeals-lifecycle-grid-dots-4)" opacity="0.65"/>

        <!-- Start Node: Filled Ink Circle -->
        <circle cx="48" cy="220" r="8" fill="#0f172a"/>
        <text x="48" y="244" fill="#64748b" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">START</text>

        <!-- Arrow: Start -> SUBMITTED -->
        <line x1="56" y1="220" x2="108" y2="220" stroke="#0f172a" stroke-width="1.4" marker-end="url(#flow-4-appeals-lifecycle-arr-muted-4)"/>

        <!-- State 1: SUBMITTED (Nộp bài) -->
        <rect x="110" y="190" width="140" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="118" y="198" width="56" height="14" rx="2" fill="#e2e8f0"/>
        <text x="146" y="208" fill="#475569" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">SUBMITTED</text>
        <text x="120" y="228" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Đã nộp bài thi</text>
        <text x="120" y="242" fill="#64748b" font-size="8.5" font-family="'JetBrains Mono', monospace">POST /exams/:id/submit</text>

        <!-- Branch: Trắc nghiệm thuần túy vs Có tự luận -->
        <!-- Path 1: 100% Trắc nghiệm -> Tự động chấm -> PUBLISHED -->
        <line x1="250" y1="220" x2="358" y2="220" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flow-4-appeals-lifecycle-arr-accent-4)"/>
        <rect x="256" y="206" width="96" height="14" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="0.8"/>
        <text x="304" y="216" fill="#2563eb" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="500" text-anchor="middle">[100% Trắc nghiệm]</text>

        <!-- Path 2: Có tự luận -> Lên trên -> NEEDS_REVIEW -->
        <path d="M 180 190 V 100 H 358" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-warning-4)"/>
        <rect x="220" y="88" width="108" height="14" rx="2" fill="#ffffff" stroke="#d97706" stroke-width="0.8"/>
        <text x="274" y="98" fill="#d97706" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="500" text-anchor="middle">[Có câu tự luận]</text>

        <!-- State 2: NEEDS_REVIEW (Chờ giáo viên chấm) -->
        <rect x="360" y="70" width="150" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
        <rect x="368" y="78" width="72" height="14" rx="2" fill="#fef3c7"/>
        <text x="404" y="88" fill="#d97706" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">NEEDS_REVIEW</text>
        <text x="368" y="108" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Chờ chấm tự luận</text>
        <text x="368" y="122" fill="#d97706" font-size="8.5" font-family="'JetBrains Mono', monospace">/submissions/needs-review</text>

        <!-- Arrow: NEEDS_REVIEW -> Giáo viên chấm xong -> PUBLISHED -->
        <path d="M 510 100 H 540 V 190" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-success-4)"/>
        <rect x="516" y="136" width="84" height="14" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="558" y="146" fill="#16a34a" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="500" text-anchor="middle">Giáo viên cho điểm</text>

        <!-- State 3: PUBLISHED (Đã công bố điểm) -->
        <rect x="360" y="190" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <rect x="368" y="198" width="62" height="14" rx="2" fill="#dbeafe"/>
        <text x="399" y="208" fill="#1d4ed8" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">PUBLISHED</text>
        <text x="368" y="228" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Đã công bố điểm</text>
        <text x="368" y="242" fill="#2563eb" font-size="8.5" font-family="'JetBrains Mono', monospace">/exam/[id]/result</text>

        <!-- Branch từ PUBLISHED: Đồng ý điểm (Thẳng) vs Khiếu nại (Xuống dưới) -->
        <!-- Path 1: Học sinh hài lòng -> FINALIZED -->
        <line x1="510" y1="220" x2="800" y2="220" stroke="#16a34a" stroke-width="1.5" marker-end="url(#flow-4-appeals-lifecycle-arr-success-4)"/>
        <rect x="580" y="206" width="150" height="15" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="655" y="217" fill="#16a34a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">[Đồng ý điểm / Hết hạn phúc khảo]</text>

        <!-- Path 2: Nộp đơn phúc khảo -> Xuống dưới -> APPEAL_FILED -->
        <path d="M 435 250 V 328 H 250 V 380" fill="none" stroke="#ef4444" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-danger-4)"/>
        <rect x="290" y="320" width="126" height="15" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="0.8"/>
        <text x="353" y="331" fill="#ef4444" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">POST /exam-results/:id/appeal</text>

        <!-- State 4: APPEAL_FILED (Đơn phúc khảo đã gửi) -->
        <rect x="180" y="380" width="150" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
        <rect x="188" y="388" width="74" height="14" rx="2" fill="#fee2e2"/>
        <text x="225" y="398" fill="#ef4444" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">APPEAL_FILED</text>
        <text x="188" y="418" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Đơn phúc khảo mới</text>
        <text x="188" y="432" fill="#ef4444" font-size="8.5" font-family="'JetBrains Mono', monospace">Kèm lý do &amp; câu hỏi sai sót</text>

        <!-- Arrow: APPEAL_FILED -> Tiếp nhận -> UNDER_EVALUATION -->
        <line x1="330" y1="410" x2="438" y2="410" stroke="#475569" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-muted-4)"/>
        <rect x="344" y="396" width="86" height="14" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="387" y="406" fill="#475569" font-size="7.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Giáo viên tiếp nhận</text>

        <!-- State 5: UNDER_EVALUATION (Đang thẩm định phúc khảo) -->
        <rect x="440" y="380" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
        <rect x="448" y="388" width="94" height="14" rx="2" fill="#e2e8f0"/>
        <text x="495" y="398" fill="#475569" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">UNDER_EVALUATION</text>
        <text x="448" y="418" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Rà soát lại bài thi</text>
        <text x="448" y="432" fill="#64748b" font-size="8.5" font-family="'JetBrains Mono', monospace">/dashboard/appeals</text>

        <!-- Branch phán quyết từ UNDER_EVALUATION: Duyệt (Cộng điểm) vs Bác bỏ (Giữ nguyên) -->
        <!-- Nhánh 1: Duyệt phúc khảo (APPROVED) -->
        <path d="M 600 400 H 680 V 330 H 780" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#flow-4-appeals-lifecycle-arr-success-4)"/>
        <rect x="646" y="348" width="124" height="15" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="0.8"/>
        <text x="708" y="359" fill="#16a34a" font-size="8" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">Duyệt: Cập nhật lại điểm (+)</text>

        <!-- Nhánh 2: Bác bỏ phúc khảo (REJECTED) -->
        <path d="M 600 420 H 680 V 460 H 780" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-muted-4)"/>
        <rect x="642" y="448" width="132" height="15" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
        <text x="708" y="459" fill="#64748b" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle">Bác bỏ: Giữ nguyên điểm &amp; Note</text>

        <!-- State 6: FINALIZED (Kết quả bài thi cuối cùng) -->
        <rect x="780" y="190" width="140" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <rect x="788" y="198" width="58" height="14" rx="2" fill="#e2e8f0"/>
        <text x="817" y="208" fill="#475569" font-size="7.5" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">FINALIZED</text>
        <text x="788" y="228" fill="#0f172a" font-size="11" font-family="'Lexend', sans-serif" font-weight="600">Điểm chốt lưu hồ sơ</text>
        <text x="788" y="242" fill="#16a34a" font-size="8.5" font-family="'JetBrains Mono', monospace">Ghi BXH &amp; Bắn Telegram</text>

        <!-- Connect Approved & Rejected to Finalized -->
        <path d="M 850 330 V 252" fill="none" stroke="#16a34a" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-success-4)"/>
        <path d="M 850 460 V 252" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#flow-4-appeals-lifecycle-arr-muted-4)"/>

        <!-- End State: Ringed Dot -->
        <circle cx="850" cy="140" r="10" fill="none" stroke="#0f172a" stroke-width="1.5"/>
        <circle cx="850" cy="140" r="5" fill="#0f172a"/>
        <line x1="850" y1="190" x2="850" y2="152" stroke="#0f172a" stroke-width="1.2" marker-end="url(#flow-4-appeals-lifecycle-arr-muted-4)"/>
        <text x="850" y="122" fill="#64748b" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">COMPLETE</text>

      </svg>
